<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Expense Tracker</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand mb-0">
        Expense Tracker
      </span>
    </div>
  </nav>


  <main class="container py-4">

    <!-- Alert -->
    <div
      id="alertBox"
      class="alert d-none"
      role="alert"
    ></div>


    <!-- Loading -->
    <div
      id="loadingSpinner"
      class="spinner-border text-primary d-none"
      role="status"
    >
      <span class="visually-hidden">
        Loading...
      </span>
    </div>


    <!-- Summary Cards -->
    <div class="row g-3 mb-4">

      <!-- Total -->
      <div class="col-md-4">
        <div class="card summary-card h-100">
          <div class="card-body text-center">

            <div class="summary-label">
              Total
            </div>

            <div
              id="totalAmount"
              class="summary-value"
            >
              0.00
            </div>

          </div>
        </div>
      </div>


      <!-- Number -->
      <div class="col-md-4">
        <div class="card summary-card h-100">
          <div class="card-body text-center">

            <div class="summary-label">
              Number of expenses
            </div>

            <div
              id="expenseCount"
              class="summary-value"
            >
              0
            </div>

          </div>
        </div>
      </div>


      <!-- Highest -->
      <div class="col-md-4">
        <div class="card summary-card h-100">
          <div class="card-body text-center">

            <div class="summary-label">
              Highest expense
            </div>

            <div
              id="highestExpense"
              class="summary-value"
            >
              0.00
            </div>

            <div
              id="highestExpenseTitle"
              class="highest-title"
            >
              -
            </div>

          </div>
        </div>
      </div>

    </div>


    <!-- Add Expense Card -->
    <div class="card content-card mb-4">

      <div class="card-body">

        <h5 class="card-heading">
          Add expense
        </h5>


        <form
          id="expenseForm"
          novalidate
        >

          <div class="row g-3">

            <!-- Title -->
            <div class="col-lg-4 col-md-6">

              <label
                for="title"
                class="form-label"
              >
                Title
              </label>

              <input
                id="title"
                type="text"
                class="form-control"
                maxlength="100"
                required
              >

              <div class="invalid-feedback">
                Title is required.
              </div>

            </div>


            <!-- Amount -->
            <div class="col-lg-3 col-md-6">

              <label
                for="amount"
                class="form-label"
              >
                Amount
              </label>

              <input
                id="amount"
                type="number"
                class="form-control"
                min="0.01"
                step="0.01"
                required
              >

              <div class="invalid-feedback">
                Enter an amount greater than 0.
              </div>

            </div>


            <!-- Category -->
            <div class="col-lg-3 col-md-6">

              <label
                for="category"
                class="form-label"
              >
                Category
              </label>

              <select
                id="category"
                class="form-select"
                required
              >

                <option value="">
                  Choose...
                </option>

                <option value="Food">
                  Food
                </option>

                <option value="Transport">
                  Transport
                </option>

                <option value="Bills">
                  Bills
                </option>

                <option value="Entertainment">
                  Entertainment
                </option>

                <option value="Other">
                  Other
                </option>

              </select>

              <div class="invalid-feedback">
                Choose a category.
              </div>

            </div>


            <!-- Date -->
            <div class="col-lg-2 col-md-6">

              <label
                for="date"
                class="form-label"
              >
                Date
              </label>

              <input
                id="date"
                type="date"
                class="form-control"
                required
              >

              <div class="invalid-feedback">
                Choose a date.
              </div>

            </div>


            <!-- Buttons -->
            <div class="col-12">

              <button
                id="submitButton"
                type="submit"
                class="btn btn-primary btn-sm px-3"
              >
                Add expense
              </button>


              <button
                id="cancelButton"
                type="button"
                class="btn btn-secondary btn-sm px-3 d-none"
              >
                Cancel
              </button>

            </div>

          </div>

        </form>

      </div>
    </div>


    <!-- Expenses Card -->
    <div class="card content-card">

      <div class="card-body">

        <div
          class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3"
        >

          <h5 class="card-heading mb-0">
            Expenses
          </h5>


          <div class="filter-box">

            <label
              for="filterCategory"
              class="me-2"
            >
              Category
            </label>

            <select
              id="filterCategory"
              class="form-select form-select-sm"
            >

              <option value="All">
                All
              </option>

              <option value="Food">
                Food
              </option>

              <option value="Transport">
                Transport
              </option>

              <option value="Bills">
                Bills
              </option>

              <option value="Entertainment">
                Entertainment
              </option>

              <option value="Other">
                Other
              </option>

            </select>

          </div>

        </div>


        <div class="table-responsive">

          <table class="table expense-table align-middle">

            <thead>

              <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th class="text-end">Actions</th>
              </tr>

            </thead>

            <tbody id="expensesTableBody">
            </tbody>

          </table>

        </div>

      </div>
    </div>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  ></script>

  <script src="js/app.js"></script>

</body>
