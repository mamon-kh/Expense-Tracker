<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Expense Tracker</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Flatpickr CSS - English Calendar -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="frontend/css/style.css">

</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">

      <span class="navbar-brand">
        Expense Tracker
      </span>

    </div>
  </nav>


  <main class="container py-3">


    <!-- Alert -->
    <div
      id="alertBox"
      class="alert alert-danger d-none"
      role="alert"
    >
    </div>


    <!-- Loading Spinner -->
    <div
      id="loadingSpinner"
      class="d-none"
    >

      <div
        class="spinner-border text-primary"
        role="status"
      >

        <span class="visually-hidden">
          Loading...
        </span>

      </div>

    </div>


    <!-- Summary Cards -->
    <div class="row g-2 mb-3">


      <!-- Total -->
      <div class="col-md-4">

        <div class="card summary-card">

          <div class="card-body">

            <div class="summary-label">
              Total
            </div>

            <div
              id="totalAmount"
              class="summary-value"
            >
              0.00
            </div>

          </div>

        </div>

      </div>


      <!-- Number of Expenses -->
      <div class="col-md-4">

        <div class="card summary-card">

          <div class="card-body">

            <div class="summary-label">
              Number of expenses
            </div>

            <div
              id="expenseCount"
              class="summary-value"
            >
              0
            </div>

          </div>

        </div>

      </div>


      <!-- Highest Expense -->
      <div class="col-md-4">

        <div class="card summary-card">

          <div class="card-body">

            <div class="summary-label">
              Highest expense
            </div>

            <div
              id="highestAmount"
              class="summary-value"
            >
              0.00
            </div>

            <div
              id="highestTitle"
              class="highest-title"
            >
              
            </div>

          </div>

        </div>

      </div>


    </div>


    <!-- Add / Edit Expense -->
    <div class="card content-card mb-3">

      <div class="card-body">


        <div
          class="card-heading"
          id="formTitle"
        >
          Add expense
        </div>


        <form
          id="expenseForm"
          novalidate
        >


          <div class="row g-2">


            <!-- Title -->
            <div class="col-md-6">

              <label
                for="title"
                class="form-label"
              >
                Title
              </label>

              <input
                type="text"
                class="form-control"
                id="title"
                maxlength="100"
                required
              >

              <div class="invalid-feedback">
                Please enter a title.
              </div>

            </div>


            <!-- Amount -->
            <div class="col-md-6">

              <label
                for="amount"
                class="form-label"
              >
                Amount
              </label>

              <input
                type="number"
                class="form-control"
                id="amount"
                min="0.01"
                step="0.01"
                required
              >

              <div class="invalid-feedback">
                Please enter a valid amount.
              </div>

            </div>


            <!-- Category -->
            <div class="col-md-6">

              <label
                for="category"
                class="form-label"
              >
                Category
              </label>

              <select
                class="form-select"
                id="category"
                required
              >

                <option
                  value=""
                  selected
                  disabled
                >
                  Choose...
                </option>

                <option value="Food">
                  Food
                </option>

                <option value="Transport">
                  Transport
                </option>

                <option value="Bills">
                  Bills
                </option>

                <option value="Entertainment">
                  Entertainment
                </option>

                <option value="Other">
                  Other
                </option>

              </select>

              <div class="invalid-feedback">
                Please choose a category.
              </div>

            </div>


            <!-- Date -->
            <div class="col-md-6">

              <label
                for="date"
                class="form-label"
              >
                Date
              </label>

              <input
                type="text"
                class="form-control"
                id="date"
                placeholder="YYYY-MM-DD"
                autocomplete="off"
                required
              >

              <div class="invalid-feedback">
                Please choose a date.
              </div>

            </div>


          </div>


          <!-- Buttons -->
          <div class="mt-2">

            <button
              type="submit"
              class="btn btn-primary"
              id="submitButton"
            >
              Add expense
            </button>


            <button
              type="button"
              class="btn btn-secondary d-none"
              id="cancelButton"
            >
              Cancel
            </button>

          </div>


        </form>

      </div>

    </div>


    <!-- Expenses -->
    <div class="card content-card">

      <div class="card-body">


        <div
          class="d-flex justify-content-between align-items-center mb-2"
        >


          <div class="card-heading mb-0">
            Expenses
          </div>


          <!-- Category Filter -->
          <div class="filter-box">

            <label
              for="categoryFilter"
              class="me-2"
            >
              Category
            </label>

            <select
              id="categoryFilter"
              class="form-select"
            >

              <option value="All">
                All
              </option>

              <option value="Food">
                Food
              </option>

              <option value="Transport">
                Transport
              </option>

              <option value="Bills">
                Bills
              </option>

              <option value="Entertainment">
                Entertainment
              </option>

              <option value="Other">
                Other
              </option>

            </select>

          </div>


        </div>


        <!-- Expenses Table -->
        <div class="table-responsive">

          <table class="table expense-table">

            <thead>

              <tr>

                <th>
                  Title
                </th>

                <th>
                  Amount
                </th>

                <th>
                  Category
                </th>

                <th>
                  Date
                </th>

                <th class="text-end">
                  Actions
                </th>

              </tr>

            </thead>


            <tbody id="expenseTableBody">

              <!-- Expenses are added by app.js -->

            </tbody>

          </table>

        </div>


      </div>

    </div>


  </main>


  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  >
  </script>


  <!-- Flatpickr JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/flatpickr"
  >
  </script>


  <!-- English Calendar -->
  <script>

    flatpickr("#date", {

      dateFormat: "Y-m-d",

      altInput: false,

      allowInput: false,

      disableMobile: true

    });

  </script>


  <!-- Expense Tracker JavaScript -->
  <script src="frontend/js/app.js"></script>


</body>

</html>
